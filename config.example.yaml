# Better Voice Input 配置文件
# 将此文件复制到 ~/.config/bvi/config.yaml 并填入你的 API Key

speech_recognition:
  provider: aliyun  # 语音识别服务商：aliyun | openai | apple
  aliyun:
    api_key: ${DASHSCOPE_API_KEY}  # 阿里云百炼 API Key
    model: qwen3-asr-flash         # 通义千问语音识别模型

text_processing:
  # OpenAI 兼容格式，支持任意兼容服务
  # 以下是各服务商的配置示例：

  # OpenAI
  base_url: https://api.openai.com/v1
  api_key: ${OPENAI_API_KEY}
  model: gpt-4o

  # # Claude (通过兼容接口)
  # base_url: https://api.anthropic.com/v1
  # api_key: ${ANTHROPIC_API_KEY}
  # model: claude-sonnet-4-20250514

  # # DeepSeek
  # base_url: https://api.deepseek.com/v1
  # api_key: ${DEEPSEEK_API_KEY}
  # model: deepseek-chat

  # # Ollama (本地)
  # base_url: http://localhost:11434/v1
  # api_key: ollama
  # model: qwen2.5:14b

processing:
  preserve_style: true  # 保留用户语言风格
